<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
  <div class="container text-center">
    <h2>📄 PDF Merger Tool</h2>
    <form id="pdfForm" enctype="multipart/form-data">
        <input type="file" id="pdfInput" multiple accept="application/pdf" class="form-control mb-3">
        <ul id="fileList" class="list-group mb-3"></ul>
        <button type="submit" class="btn btn-primary">Merge PDFs</button>
    </form>
    <p class="mt-3 text-muted">Select 2 or more PDFs to merge into a single file. Use arrows to reorder files.</p>
</div>

<script>
    const pdfInput = document.getElementById('pdfInput');    
    const fileList = document.getElementById('fileList');
    const form = document.getElementById('pdfForm');

    let filesArray = [];

    pdfInput.addEventListener('change', () => {
        filesArray = Array.from(pdfInput.files);
        renderFileList();
    });

    function renderFileList() {
        fileList.innerHTML = '';
        filesArray.forEach((file, index) => {
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.textContent = file.name;

            const btnGroup = document.createElement('div');

            const upBtn = document.createElement('button');
            upBtn.textContent = '⬆';
            upBtn.className = 'btn btn-sm btn-secondary me-1';
            upBtn.disabled = index === 0;
            upBtn.onclick = () => moveUp(index);

            const downBtn = document.createElement('button');
            downBtn.textContent = '⬇';
            downBtn.className = 'btn btn-sm btn-secondary';
            downBtn.disabled = index === filesArray.length - 1;
            downBtn.onclick = () => moveDown(index);

            btnGroup.appendChild(upBtn);
            btnGroup.appendChild(downBtn);
            li.appendChild(btnGroup);

            fileList.appendChild(li);
        });
    }

    function moveUp(index) {
        debugger;
        [filesArray[index - 1], filesArray[index]] = [filesArray[index], filesArray[index - 1]];
        renderFileList();
    }

    function moveDown(index) {
        debugger;
        [filesArray[index], filesArray[index + 1]] = [filesArray[index + 1], filesArray[index]];
        renderFileList();
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (filesArray.length < 2) {
            alert("Please select at least 2 PDFs!");
            return;
        }

        const formData = new FormData();
        filesArray.forEach(file => formData.append('pdfs', file));

        try {
            const response = await fetch('/merge', { method: 'POST', body: formData });

            if (!response.ok) {
                const data = await response.json();
                alert(data.error);
                return;
            }

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "merged.pdf";
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);

        } catch (err) {
            alert("Something went wrong!");
        }
    });
</script>


</body>

</html>
